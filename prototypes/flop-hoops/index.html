<script>
'use strict';
// Flop Hoops: the game shell. Input, sound, and the state machine (title, round card, play,
// basket celebration, pause, results). Physics, rendering, scoring rules and round rolls live
// in js/. Keep the fixed step, the clock hook, window.game and the play and figures scenes.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = '"Courier New", ui-monospace, Menlo, Consolas, monospace'; // retro: a blocky monospace
const TITLE = 'Flop Hoops';
const CONTROLS = ['Player 1: W jump/shoot, S bounce', 'Player 2: Up jump/shoot, Down bounce', 'Esc / P: pause', 'M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

const events = []; // window.game.events: anything the game wants a run to see
Render.setFont(FONT);
Settings.load();   // this browser's saved settings, if any

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  viewScale = s;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
const text = (s, x, y, size, c, o) => Render.text(ctx, s, x, y, size, c, o);

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
const KEYS = ['KeyW', 'ArrowUp'];       // team 0 jumps (and cocks a shot) on W, team 1 on Up Arrow
const BOUNCE_KEYS = ['KeyS', 'ArrowDown']; // with the ball: hold to wind up, let go to bounce it (dribble or pass)
addEventListener('keydown', e => {

  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
document.addEventListener('visibilitychange', () => { if (document.hidden) { down.clear(); if (scene === 'play' || scene === 'card') pauseGame(); } });
// Buttons on screen are clickable too; each one does what its key does.
let buttons = [];
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  const b = buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (b) activate(b);
  else if (scene === 'settings') settingsClick(x, y);

// Settings list: the wheel scrolls it; clicking or dragging on a slider sets that value.
let dragKey = null;
canvas.addEventListener('wheel', e => { if (scene === 'settings') { e.preventDefault(); settingsMove(Math.sign(e.deltaY) * 3); } }, { passive: false });
canvas.addEventListener('pointerup', () => { dragKey = null; });
// Menus: the pointer lights the button under it; arrows or W/S move the focus; Enter presses it.
let mouse = { x: -1, y: -1 }, menuFocus = 0, menuScene = '', menuPress = null;
canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  mouse = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  const i = buttons.findIndex(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
  if (i >= 0) menuFocus = i;
  if (dragKey && e.buttons) settingsSlide(dragKey, mouse.x);
});
/** Press a button: it squashes for a moment, then its action runs (on the game step, not a timer). */
function activate(b) { if (menuPress) return; sfx.click(); menuPress = { t: 0.14, action: b.action, label: b.label }; }
/** Arrow / W / S focus moves and Enter / Space presses, for any menu scene. */
function menuKeys() {
  if (!buttons.length) return false;
  if (pressed('ArrowDown') || pressed('ArrowRight') || pressed('KeyS')) { menuFocus = (menuFocus + 1) % buttons.length; sfx.click(); }
  if (pressed('ArrowUp') || pressed('ArrowLeft') || pressed('KeyW')) { menuFocus = (menuFocus + buttons.length - 1) % buttons.length; sfx.click(); }
  if (pressed('Enter') || pressed('Space')) { activate(buttons[Math.min(menuFocus, buttons.length - 1)]); return true; }
  return false;

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {

    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;

    const len = ac.sampleRate, buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    let x = 12345; for (let i = 0; i < len; i++) { x = (x * 1103515245 + 12345) & 0x7fffffff; data[i] = x / 0x3fffffff - 1; }

  const t = audio.ac.currentTime + delay, src = audio.ac.createBufferSource(), f = audio.ac.createBiquadFilter(), g = audio.ac.createGain();

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

function limited(key, gap) { const t = state ? state.t : 0; if (lastSound[key] !== undefined && t - lastSound[key] < gap && t >= lastSound[key]) return true; lastSound[key] = t; return false; }

  floor(v) { if (!limited('floor', 0.05)) tone(150, 0.14, 'triangle', Math.min(0.45, v * 0.04), 0, 60); },
  board(v) { if (!limited('board', 0.05)) { tone(210, 0.1, 'square', Math.min(0.18, v * 0.02), 0, 120); noise(0.06, Math.min(0.2, v * 0.02), 900); } },
  rim(v) { if (!limited('rim', 0.06)) { tone(880, 0.25, 'triangle', Math.min(0.22, v * 0.03)); tone(1310, 0.16, 'square', Math.min(0.06, v * 0.01)); } },
  bop(v) { if (!limited('bop', 0.04)) tone(260, 0.08, 'sine', Math.min(0.3, 0.05 + v * 0.025), 0, 170); },
  swish() { noise(0.35, 0.3, 3200); [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.08, 0.12 + i * 0.08)); },
  whistle() { tone(2100, 0.12, 'sine', 0.12, 0, 2300); tone(2100, 0.28, 'sine', 0.12, 0.15, 2250); },
  win() { [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'square', 0.09, i * 0.12)); },
  click() { tone(660, 0.05, 'square', 0.06); },
  grab() { tone(392, 0.06, 'square', 0.08); tone(523, 0.08, 'square', 0.06, 0.05); },
  shoot(c) { tone(300 + c * 300, 0.16, 'triangle', 0.14, 0, 700 + c * 500); },
  dunk() { tone(110, 0.3, 'square', 0.22, 0, 55); noise(0.25, 0.35, 700); },
  cheer(big) { // a crowd: two bands of noise swelling and fading, a few rising whoops on top
    if (!audio || muted) return;
    const ac = audio.ac, t = ac.currentTime;
    for (const [f, q] of [[900, 0.8], [1700, 1.2]]) {
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = audio.noise; src.loop = true; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18 * big, t + 0.25);
      g.gain.setValueAtTime(0.18 * big, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      src.connect(bp).connect(g).connect(audio.out); src.start(t); src.stop(t + 1.9);
    }

  },
  sparks() { noise(0.9, 0.12, 5200); noise(0.5, 0.08, 3000, 0.15); },
  bounce(c) { tone(200 + c * 120, 0.09, 'triangle', 0.16, 0, 120); },
  perfect() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.06, i * 0.05)); },
  block() { noise(0.12, 0.3, 1600); tone(180, 0.12, 'square', 0.12, 0, 90); },
};

// ---- Game state -----------------------------------------------------------------------
// world: the Matter.js world of the current round. Kept out of `state` so state stays plain data.
let scene, state, world = null, pauseFrom = 'play', prevVenue = '';
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, score: [0, 0], round: 0, venue: '', settings: null, cardT: 0, scoredT: 0,
    dribble: null, fire: null, scorer: -1, winner: -1, pops: [0, 0], shake: 0, stall: 0, toast: '', toastT: 0, toastTeam: -1, scoreKind: '', particles: [], resultsT: 0, attract: [0, 0], gained: '' };
  prevVenue = '';
}
const CALLOUTS = { block: 'BLOCKED!', steal: 'STOLEN!', strip: 'KNOCKED LOOSE!' };
function callout(s, team) { state.toast = s; state.toastT = 1.1; state.toastTeam = team; }
function onPhysEvent(ev) {

  if (ev.type === 'dribble') { sfx.bounce(0.2); world.flash.t = 0.25; events.push({ type: 'dribble', team: ev.team }); return; }
  if (ev.type === 'grab') { sfx.grab(); world.flash.t = 0.25; events.push({ type: 'grab', team: ev.team }); return; }
  if (ev.type === 'shoot' || ev.type === 'fadeaway') {
    sfx.shoot(ev.charge); events.push({ type: ev.type, team: ev.team });
    if (ev.perfect) { callout('PERFECT!', ev.team); sfx.perfect(); }
    else if (ev.type === 'fadeaway') callout('FADEAWAY!', ev.team);
    return;
  }
  if (ev.type === 'dribbleout') { sfx.bounce(ev.quality === 'clean' ? 0.4 : 0.1); state.dribble = { team: ev.team, n: ev.chain, t: 1.2, clean: ev.quality === 'clean', sloppy: ev.sloppy }; events.push({ type: 'dribbleout', team: ev.team, chain: ev.chain }); return; }
  if (ev.type === 'bounce') { sfx.bounce(ev.charge); events.push({ type: 'bounce', team: ev.team, charge: ev.charge }); return; }
  if (ev.type === 'dunkstart') { sfx.grab(); events.push({ type: 'dunkstart', team: ev.team }); return; }
  if (ev.type === 'dunk') { state.fire = { hoop: world.hoops.find(h => h.team === ev.team), t: tune.fire_time }; sparkShow(); puff(ev.x, ev.y, 10, { speed: 320, life: 0.45, colors: ['#ffd23f', '#ffffff', Render.TEAM_COLORS[ev.team]], size: 9, g: 700 }); sfx.dunk(); state.shake = tune.shake * 0.6; events.push({ type: 'dunk', team: ev.team }); return; }
  if (ev.type === 'steal') world.flash.t = 0.25;
  if (CALLOUTS[ev.type]) { sfx.block(); state.shake = Math.max(state.shake, tune.shake * 0.4); callout(CALLOUTS[ev.type], ev.team); events.push({ type: ev.type, team: ev.team }); return; }
  if (ev.type === 'land') { if (ev.speed > 4) puff(ev.x, ev.y - 4, 4, { speed: 120, angle: -Math.PI / 2, cone: 2.6, life: 0.35, colors: [DUST()], size: 8, g: 300, jitter: 20 }); return; }
  if (ev.type !== 'hit' || ev.speed < 1.2) return;
  if (ev.on === 'floor' && ev.speed > 3) puff(ev.x, Physics.FLOOR_Y - 4, 3, { speed: 90, angle: -Math.PI / 2, cone: 2.4, life: 0.3, colors: [DUST()], size: 7, g: 250, jitter: 14 });
  if (ev.on === 'rim' && ev.speed > 2) puff(ev.x, ev.y, 4, { speed: 220, life: 0.25, colors: ['#ffd23f', '#ffffff'], size: 6, g: 600 });
  if (ev.on === 'player') { sfx.bop(ev.speed); events.push({ type: 'touch', team: ev.team }); }
  else if (ev.on === 'floor') sfx.floor(ev.speed);
  else if (ev.on === 'board') { sfx.board(ev.speed); if (ev.hoop) ev.hoop.wobble = 1; }
  else if (ev.on === 'rim') { sfx.rim(ev.speed); if (ev.hoop) ev.hoop.wobble = 1.4; }
}
/** Roll a round and build its world. */
function buildRound(round) {
  const S = Rounds.roll(rng, round, prevVenue, tune);
  prevVenue = S.venue;
  state.settings = S; state.round = round; state.venue = S.venueName;
  world = Physics.createWorld(S, tune, rng, onPhysEvent);
  world.hustle = [0, 1].map(t => state.score[1 - t] - state.score[t] >= tune.hustle_gap); // the trailing team hustles
  world.flash = { t: 0 };
  buildPalette(S);
  state.stall = 0;
}
// mode: 'cpu' (Player 1 against the computer, which plays the Tealbacks) or '2p' (two people)
let mode = 'cpu', cpu = null;
function newMatch(m) {
  if (m === 'cpu' || m === '2p') mode = m;
  reset(); state.mode = mode;
  cpu = mode === 'cpu' ? AI.create(1, rng) : null;
  nextRound(); events.push({ type: 'match', mode });
}
function nextRound() { buildRound(state.round + 1); state.cardT = 0; scene = 'card'; sfx.whistle(); }
function pauseGame() { pauseFrom = scene; scene = 'pause'; }
function toMenu() { reset(); buildRound(1); scene = 'title'; }
// Game speed: the physics advances tune.game_speed steps per game step (below 1 is slower).

  pendingB = pendingB.map((p, i) => p || bheld[i]);

  while (physAcc >= 1) {
    const now = pending.map((p, i) => held[i] || (p && !physStepSaw[i]));
    const nowB = pendingB.map((p, i) => bheld[i] || (p && !physStepSawB[i]));

/** Both teams' keys this step: [jump keys, bounce keys]. Against the CPU, it presses the Tealbacks' keys. */
function teamKeys() {
  const j = heldKeys(), b = bounceKeys();

/** The cold-spark machines at both court edges fountain for a moment. */

function updateJuice(dt) {

  }

// size on top, so they stay readable.
const pix = document.createElement('canvas'), pctx = pix.getContext('2d', { willReadFrequently: true });

// few steps between the sky's two colours. Each court pixel snaps to its nearest entry, which
// removes soft edges and bands gradients. Lookups are cached per colour.

  for (const team of S.looks) for (const l of team) { cols.add(l.skin); cols.add(l.shoe); }
  for (const c of Render.RAINBOW) cols.add(c);
  for (const c of [Render.FADE_BLUE, ...Render.ICE, '#3a3f55', '#5d6480', '#24283a']) cols.add(c);

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (scene !== menuScene) { menuScene = scene; menuFocus = scene === 'settings' ? -1 : 0; }   // in settings the list has the keys; buttons light on hover
  if (menuPress) { menuPress.t -= STEP; if (menuPress.t <= 0) { const a = menuPress.action; menuPress = null; a(); } }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get ball() { return world ? { x: world.ball.position.x, y: world.ball.position.y } : null; }, // read-only, for checks
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
buildRound(1);
scene = params.get('scene') || 'title';
if (scene === 'play') { state.round = 1; }
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
