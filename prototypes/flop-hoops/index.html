// Settings list: the wheel scrolls it; clicking or dragging on a slider sets that value.

let mouse = { x: -1, y: -1 }, menuFocus = 0, menuScene = '', menuPress = null;

  const r = canvas.getBoundingClientRect();

  const i = buttons.findIndex(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
  if (i >= 0) menuFocus = i;
  if (dragKey === 'ai_level' && e.buttons && scene === 'title') Settings.set('ai_level', 1 + Math.round(Math.max(0, Math.min(1, (mouse.x - LEVEL.x) / LEVEL.w)) * (AI.LEVELS.length - 1)));

/** Press a button: it squashes for a moment, then its action runs (on the game step, not a timer). */
function activate(b) { if (menuPress) return; sfx.click(); menuPress = { t: 0.14, action: b.action, label: b.label }; }
/** Arrow / W / S focus moves and Enter / Space presses, for any menu scene. */
function menuKeys() {

  if (pressed('Enter') || pressed('Space')) { activate(buttons[Math.min(menuFocus, buttons.length - 1)]); return true; }

// ---- Audio: started on first input, mute on M --------------------------------------------
// Everything is synthesised. Voices go through a soft compressor, and a share of each goes to a
// short generated room reverb, so effects sound rounded and have a little space around them.
let audio = null, muted = false;
function startAudio() {

    const has = f => typeof ac[f] === 'function';
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;

      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 3.2; comp.attack.value = 0.004; comp.release.value = 0.18;

const lastSound = {};

const sfx = {
  click() { tone(1760, 0.07, 'sine', 0.05, 0, 1760, { att: 0.002, verb: 0.08 }); tone(2640, 0.05, 'sine', 0.025, 0.012, 2640, { att: 0.002, verb: 0.05 }); },
  jump(team) { if (limited('jump' + team, 0.05)) return; const k = team ? 1.12 : 1; noise(0.11, 0.05, 500 * k, 0, { to: 1500 * k, q: 1.1, att: 0.02, pan: team ? 0.3 : -0.3 }); tone(190 * k, 0.12, 'sine', 0.07, 0, 330 * k, { att: 0.01, glide: 0.08, pan: team ? 0.3 : -0.3 }); },
  floor(v) { if (limited('floor', 0.05)) return; const a = Math.min(0.4, v * 0.04); tone(150, 0.16, 'sine', a, 0, 52, { att: 0.002, glide: 0.1, verb: 0.05 }); noise(0.03, a * 0.35, 1800, 0, { type: 'lowpass', q: 0.5 }); },
  bop(v) { if (limited('bop', 0.04)) return; const a = Math.min(0.28, 0.05 + v * 0.022); tone(230, 0.1, 'sine', a, 0, 120, { att: 0.003, glide: 0.07, verb: 0.05 }); noise(0.045, a * 0.5, 700, 0, { type: 'lowpass', q: 0.4 }); },
  board(v) { if (limited('board', 0.05)) return; const a = Math.min(0.2, v * 0.02); tone(260, 0.14, 'triangle', a, 0, 200, { att: 0.002, verb: 0.15 }); tone(392, 0.1, 'sine', a * 0.6, 0, 330, { att: 0.002 }); noise(0.05, a * 0.8, 1100, 0, { q: 1.4 }); },
  rim(v) { if (limited('rim', 0.06)) return; ring(880 + arand() * 60, 0.7, Math.min(0.2, v * 0.028), 0, 0.35); noise(0.03, 0.05, 3400, 0, { q: 1.6 }); },
  swish() { noise(0.34, 0.16, 4200, 0, { to: 1500, q: 0.7, att: 0.02, verb: 0.25 }); [2, 4, 5].forEach((n, k) => tone(PENT[n] * 2, 0.5, 'sine', 0.05, 0.1 + k * 0.07, PENT[n] * 2, { att: 0.004, verb: 0.45 })); },
  grab() { noise(0.035, 0.07, 2600, 0, { q: 1.5 }); tone(520, 0.1, 'sine', 0.07, 0, 780, { att: 0.004, glide: 0.06 }); },
  shoot(c) { noise(0.2, 0.08, 500, 0, { to: 2600 + c * 1200, q: 0.9, att: 0.05, verb: 0.2 }); tone(300 + c * 160, 0.18, 'sine', 0.06, 0, 700 + c * 300, { att: 0.02, glide: 0.16 }); },
  bounce(c) { tone(210 + c * 110, 0.11, 'triangle', 0.11, 0, 130, { att: 0.003, glide: 0.08, lp: 1800, verb: 0.08 }); tone(420 + c * 220, 0.06, 'sine', 0.03, 0, 300, { att: 0.002 }); },
  dunk() { tone(96, 0.7, 'sine', 0.5, 0, 36, { att: 0.002, glide: 0.4, verb: 0.3 }); noise(0.09, 0.35, 5200, 0, { type: 'highpass', q: 0.5, att: 0.001, verb: 0.35 }); tone(180, 0.22, 'triangle', 0.2, 0, 70, { att: 0.002, glide: 0.15 }); noise(0.4, 0.14, 900, 0.02, { to: 250, q: 0.6, verb: 0.3 }); },
  swat() { noise(0.09, 0.3, 2600, 0, { q: 1.2, att: 0.001, verb: 0.2 }); tone(260, 0.16, 'triangle', 0.22, 0, 90, { att: 0.002, glide: 0.1 }); ring(1400, 0.3, 0.06, 0.01, 0.2, [1, 1.5]); },
  block() { noise(0.1, 0.24, 2200, 0, { q: 1.2, att: 0.001, verb: 0.15 }); tone(220, 0.14, 'triangle', 0.16, 0, 95, { att: 0.002, glide: 0.1 }); },
  whistle() { for (const d of [0, 0.2]) { tone(2650, 0.17, 'sine', 0.07, d, 2750, { att: 0.012, verb: 0.3 }); tone(2660, 0.17, 'sine', 0.035, d + 0.005, 2770, { att: 0.012, detune: 14 }); noise(0.16, 0.03, 4800, d, { type: 'highpass', att: 0.01 }); } },
  win() { [0, 2, 3, 5, 6, 8].forEach((n, k) => { tone(PENT[n], 0.6, 'sawtooth', 0.045, k * 0.11, PENT[n], { att: 0.01, lp: 3200, detune: 7, verb: 0.4 }); tone(PENT[n] / 2, 0.6, 'sine', 0.05, k * 0.11, PENT[n] / 2, { verb: 0.3 }); }); },

  cheer(big) {   // a crowd: noise through vowel-like bands, swelling and settling, with a few claps on top

const CALLOUTS = { block: 'INTERCEPTED!', steal: 'STOLEN!', strip: 'KNOCKED LOOSE!' };   // (a block is a shot taken out of the air: intercepted)

      ptext(L.name, LEVEL.x + LEVEL.w / 2, 410, 4, Render.levelColor(lv, n), { shadow: 3 });
      btn('<', 139, 428, 40, 48, () => Settings.set('ai_level', lv - 1), '', 4, { kind: 'secondary', icon: 'left', glyphOnly: true });
      btn('>', 583, 428, 40, 48, () => Settings.set('ai_level', lv + 1), '', 4, { kind: 'secondary', icon: 'right', glyphOnly: true });
      Render.levelBar(ctx, LEVEL.x, LEVEL.y, LEVEL.w, lv, n, state.t);
      wrapText(L.does, 38).slice(0, 2).forEach((l, i) => ptext(l, LEVEL.x + LEVEL.w / 2, 504 + i * 24, 2, '#e6ddff', { shadow: 2 }));
      // the controls: each team's two keys, then the finer points
      Render.panel(ctx, 650, 344, 498, 214, { title: 'CONTROLS', accents: Render.TEAM_COLORS });
      for (const team of [0, 1]) {
        const x0 = team ? 916 : 672, col = Render.TEAM_COLORS[team];
        ctx.fillStyle = col; ctx.fillRect(x0, 394, 8, 12);
        ptext(Render.TEAM_NAMES[team].toUpperCase(), x0 + 16, 400, 2, col, { align: 'left', shadow: 2 });
        Render.keycap(ctx, x0 + 20, 438, team ? 'up' : 'W', 0.62); ptext('JUMP / SHOOT', x0 + 50, 440, 2, '#ffffff', { align: 'left', shadow: 2 });
        Render.keycap(ctx, x0 + 20, 476, team ? 'down' : 'S', 0.62); ptext('BOUNCE / PASS', x0 + 50, 478, 2, '#ffffff', { align: 'left', shadow: 2 });
      }
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(898, 392, 2, 100);
      ptext('HOLD JUMP, LET GO TO SHOOT · TAP NEAR THE RIM TO DUNK', 899, 518, 1.5, '#b9b1d6', { shadow: 1 });
      ptext('TAP BOUNCE TO DRIBBLE · HOLD IT TO PASS', 899, 538, 1.5, '#b9b1d6', { shadow: 1 });
      // secondary actions
      btn('SETTINGS', W / 2 - 274, 590, 260, 54, openSettings, '', 3, { kind: 'secondary', icon: 'gear' });
      btn(muted ? 'SOUND: OFF' : 'SOUND: ON', W / 2 + 14, 590, 260, 54, () => setMuted(!muted), '', 3, { kind: 'secondary', icon: muted ? 'mute' : 'sound' });
      ptext(`FIRST TO ${tune.win_score} POINTS  ·  LONG SHOTS +2  ·  ESC / P PAUSES  ·  M MUTES  ·  ARROWS + ENTER PICK`, W / 2, H - 30, 1.5, '#b3acd2', { shadow: 1 });
      ctx.restore();
    },
  },
  settings: {
    update(dt) {
      state.t += dt;
      if (menuPress) return;
      if (pressed('Escape') || pressed('Enter') || pressed('Backspace')) { scene = settingsFrom; return; }
      if (pressed('ArrowDown') || pressed('KeyS')) settingsMove(1);
      if (pressed('ArrowUp') || pressed('KeyW')) settingsMove(-1);
      if (pressed('PageDown')) settingsMove(SET.show);
      if (pressed('PageUp')) settingsMove(-SET.show);
      const row = settingsRows[settingsSel], l = down.has('ArrowLeft') || down.has('KeyA'), r = down.has('ArrowRight') || down.has('KeyD');
      if (row && row.key) {
        if (pressed('ArrowLeft') || pressed('KeyA')) { Settings.nudge(row.key, -1); repeatT = 0.35; }
        else if (pressed('ArrowRight') || pressed('KeyD')) { Settings.nudge(row.key, 1); repeatT = 0.35; }
        else if (l || r) { repeatT -= dt; if (repeatT <= 0) { Settings.nudge(row.key, r ? 1 : -1); repeatT = 0.04; } }   // held: keeps stepping
      }
    },
    draw() {
      if (settingsFrom === 'title') drawCourt(c => Render.menuBackdrop(c, W, H, state.t), false);
      else { drawGame(); }
      overlay(0.55);
      ptext('SETTINGS', W / 2, 62, 8, '#ffd23f', { outline: true, shadow: 6 });
      ptext(settingsAdvanced ? 'UP/DOWN PICK  ·  LEFT/RIGHT CHANGE (HOLD TO RUN)  ·  CLICK OR DRAG A SLIDER  ·  WHEEL SCROLLS' : 'UP/DOWN PICK  ·  LEFT/RIGHT CHANGE  ·  OR CLICK A BAR', W / 2, 112, 2, '#e6ddff');
      const sm = !settingsAdvanced, fs = sm ? 3 : 2, bh = sm ? 12 : 8;
      Render.panel(ctx, SET.x, SET.y - 14, SET.w, SET.rowH * SET.show + 20, { accent: '#ffd23f' });
      for (let n = 0; n < SET.show; n++) {
        const i = settingsTop + n, row = settingsRows[i]; if (!row) break;
        const y = SET.y + n * SET.rowH + SET.rowH / 2;
        if (row.header) { ptext(row.header, SET.x + 24, y, 3, '#ffd23f', { align: 'left' }); continue; }
        const k = row.key, sel = i === settingsSel;
        if (sel) { ctx.fillStyle = '#3d3175'; ctx.fillRect(SET.x + 6, y - SET.rowH / 2 + 2, SET.w - 12, SET.rowH - 4); ctx.fillStyle = '#ffd23f'; ctx.fillRect(SET.x + 6, y - SET.rowH / 2 + 2, 4, SET.rowH - 4); }
        ptext(Settings.label(k, sm), SET.x + 44, y, fs, !sm && Settings.changed(k) ? '#ff9a3c' : '#ffffff', { align: 'left', shadow: 2 });
        ptext(sm ? Settings.showSimple(k) : Settings.show(k), SET.sliderX - 24, y, fs, '#fff1a8', { align: 'right', shadow: 2 });
        ctx.fillStyle = '#0a0618'; ctx.fillRect(SET.sliderX, y - bh / 2, SET.sliderW, bh);
        ctx.fillStyle = sel ? '#1fc2b1' : '#5d6480'; ctx.fillRect(SET.sliderX, y - bh / 2, SET.sliderW * Settings.share(k), bh);
        ctx.fillStyle = sel ? '#ffffff' : '#c9c3e0'; ctx.fillRect(SET.sliderX + SET.sliderW * Settings.share(k) - 5, y - bh, 10, bh * 2);
        if (sel && Math.floor(state.t * 4) % 2) { ctx.fillStyle = '#ffffff'; for (let q = 0; q < 3; q++) ctx.fillRect(SET.x + 18 + q * 3, y - (3 - q) * 3, 3, (3 - q) * 6); }
      }
      if (settingsAdvanced) {   // scroll bar for the long list
        const total = settingsRows.length, barH = SET.rowH * SET.show;
        ctx.fillStyle = '#0a0618'; ctx.fillRect(SET.x + SET.w - 14, SET.y - 8, 8, barH);
        ctx.fillStyle = '#ffd23f'; ctx.fillRect(SET.x + SET.w - 14, SET.y - 8 + barH * settingsTop / total, 8, Math.max(16, barH * SET.show / total));
        const sel = settingsRows[settingsSel], note = sel && sel.key ? Settings.describe(sel.key) : '';   // a setting with a plain line of its own says it here
        ptext(note || 'ORANGE NAMES ARE CHANGED FROM THE DEFAULT. SIZES OF BODIES AND COURT APPLY FROM THE NEXT ROUND.', W / 2, 600, 2, note ? '#e6ddff' : '#c9c3e0');
      } else {                  // a plain line about the highlighted setting
        const row = settingsRows[settingsSel];
        if (row) ptext(Settings.describe(row.key), W / 2, 596, 2, '#e6ddff');
      }
      buttons = [];
      btn('BACK', 210, 628, 260, 58, () => { scene = settingsFrom; }, '', 3, { kind: 'primary', icon: 'back' });
      btn(settingsAdvanced ? 'SIMPLE' : 'ADVANCED', 510, 628, 260, 58, () => setSettingsMode(!settingsAdvanced), '', 3, { kind: 'secondary', icon: 'sliders' });
      btn('RESET ALL', 810, 628, 260, 58, () => Settings.reset(), '', 3, { kind: 'secondary', icon: 'restart', accent: '#ff7a6a' });
    },
  },
  card: { // the round card: physics frozen while it flips in
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { pauseGame(); return; }
      state.cardT += dt; state.t += dt; updateJuice(dt);
      if (state.cardT >= tune.card_time) { scene = 'play'; events.push({ type: 'round', round: state.round, venue: state.venue }); }
    },
    draw() { drawGame(); Render.roundCard(ctx, W, H, state.cardT, tune.card_time, state.settings); buttons = []; },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { pauseGame(); return; }
      state.t += dt; updateJuice(dt);
      if (state.hitstop > 0) { state.hitstop--; return; }   // a few frozen frames on the slam
      const { prev, cur } = physStep(...teamKeys());
      const hoop = Scoring.basket(prev, cur, world.hoops);
      if (hoop) { score(hoop); return; }
      checkStall(dt);
    },
    draw() { drawGame(); buttons = []; },
  },
  scored: { // the basket: shake, confetti, score pop, a short slow-motion, then the next round
    update(dt) {
      state.scoredT += dt; state.t += dt; updateJuice(dt);
      if (state.scoredT < 0.6 ? Math.round(state.scoredT * 60) % 2 === 0 : true) physStep(...teamKeys());
      if (state.scoredT >= tune.score_time) {
        if (state.winner >= 0) { startReel('results'); state.resultsT = 0; state.gained = `${Render.TEAM_NAMES[state.winner]} win`; sfx.win(); events.push({ type: 'win', team: state.winner }); }
        else nextRound();
      }
    },
    draw() {
      drawGame();
      const k = Math.min(1, state.scoredT / 0.25), team = state.scorer;
      ctx.save(); ctx.translate(W / 2, 250); ctx.scale(k, k); ctx.rotate(-0.04);
      text(`${Render.TEAM_NAMES[team].toUpperCase()} SCORE!`, 0, 0, 64, Render.TEAM_COLORS[team], { weight: 900, stroke: 11 });
      text(state.scoreKind + (state.points === 2 ? '  +2' : '  +1'), 0, 62, 40, state.points === 2 ? '#ff9a3c' : '#ffd23f', { weight: 900, stroke: 8 });
      text(`${state.score[0]} - ${state.score[1]}`, 0, 116, 36, '#ffffff', { weight: 900, stroke: 7 });
      ctx.restore();
      buttons = [];
    },
  },
  watch: { // WATCH CPU: pick how strong each computer is, then start
    update(dt) { state.t += dt; menuKeys(); if (pressed('Escape')) scene = 'title'; },
    draw() {
      drawCourt(c => Render.menuBackdrop(c, W, H, state.t), false);
      ptext('WATCH CPU', W / 2, 96, 9, '#ffd23f', { outline: true, shadow: 6 });
      ptext('PICK HOW STRONG EACH COMPUTER IS', W / 2, 166, 3, '#ffffff');
      buttons = [];
      for (const team of [0, 1]) {
        const x = W / 2 + (team ? 250 : -250), lv = watchLv[team], L = AI.LEVELS[lv - 1], n = AI.LEVELS.length;
        Render.panel(ctx, x - 220, 214, 440, 270, { title: Render.TEAM_NAMES[team].toUpperCase(), accent: Render.TEAM_COLORS[team] });
        ptext(`LEVEL ${lv}`, x + 200, 244, 2, '#c9c3e0', { align: 'right' });
        ptext(L.name, x, 300, 4, Render.levelColor(lv, n), { shadow: 3 });
        btn('<', x - 206, 330, 44, 48, () => { watchLv[team] = Math.max(1, lv - 1); }, '', 4, { kind: 'secondary', icon: 'left', glyphOnly: true });
        btn('>', x + 162, 330, 44, 48, () => { watchLv[team] = Math.min(AI.LEVELS.length, lv + 1); }, '', 4, { kind: 'secondary', icon: 'right', glyphOnly: true });
        Render.levelBar(ctx, x - 125, 354, 250, lv, n, state.t + team, { h: 20 });
        wrapText(L.does, 32).slice(0, 3).forEach((l, i) => ptext(l, x, 420 + i * 26, 2, '#e6ddff', { shadow: 2 }));
      }
      btn('START', W / 2 - 160, 532, 320, 78, () => newMatch('sim', watchLv.slice()), 'ENTER', 5, { kind: 'primary', icon: 'play' });
      btn('BACK', 40, H - 88, 200, 52, () => { scene = 'title'; }, 'ESC', 3, { kind: 'secondary', icon: 'back' });
    },
  },
  pause: {
    update() {
      if (menuKeys()) return;
      if (pressed('KeyP') || pressed('Escape')) scene = pauseFrom;
      else if (pressed('KeyR')) newMatch();
      else if (pressed('KeyQ')) toMenu();
    },
    draw() {
      drawGame(); overlay(0.6);
      ptext('PAUSED', W / 2, 176, 10, '#ffd23f', { outline: true, shadow: 8 });
      ptext(`${Render.TEAM_NAMES[0]} ${state.score[0]} - ${state.score[1]} ${Render.TEAM_NAMES[1]}`, W / 2, 244, 3, '#ffffff');
      Render.panel(ctx, W / 2 - 200, 280, 400, 380, { accents: Render.TEAM_COLORS });
      buttons = [];
      btn('RESUME', W / 2 - 160, 310, 320, 68, () => { scene = pauseFrom; }, 'P OR ESC', 4, { kind: 'primary', icon: 'play' });
      btn('RESTART', W / 2 - 160, 424, 320, 64, newMatch, 'R', 4, { kind: 'secondary', icon: 'restart' });
      btn('MAIN MENU', W / 2 - 160, 534, 320, 64, toMenu, 'Q', 4, { kind: 'secondary', icon: 'home' });
      btn('SETTINGS', 30, H - 120, 220, 54, openSettings, '', 3, { kind: 'secondary', icon: 'gear' });
      btn(muted ? 'SOUND: OFF' : 'SOUND: ON', W - 270, H - 120, 240, 54, () => setMuted(!muted), 'M', 3, { kind: 'secondary', icon: muted ? 'mute' : 'sound' });
    },
  },
  replay: { // the best moments of the match, in slow motion around the big moment
    update(dt) {
      state.t += dt;
      const R = reelState, c = R.clips[R.i];
      if (!R.cheered && R.f >= c.focus) { R.cheered = true; sfx.cheer(0.7); }
      R.f += [c.focus, ...(c.also || [])].some(f => Math.abs(R.f - f) < 40) ? tune.replay_slow : 1;   // slow around the moment itself (and the pump fake behind it)
      if (pressed('Escape') || pressed('KeyQ')) { endReel(); return; }
      if (R.f >= c.len - 1 || pressed('Enter') || pressed('Space') || pressed('KeyE')) { R.i++; R.f = 0; R.cheered = false; if (R.i >= R.clips.length) endReel(); }
    },
    draw() {
      const R = reelState, c = R.clips[Math.min(R.i, R.clips.length - 1)];
      let view = null;
      drawCourt(cx => { view = Replay.apply(c, R.f, tune.trail_length); Render.world(cx, view, 1, state.t, W, H); });
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95); vg.addColorStop(0, 'rgba(10,6,24,0)'); vg.addColorStop(1, 'rgba(10,6,24,0.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(10,6,24,0.85)'; ctx.fillRect(0, 0, W, 70); ctx.fillRect(0, H - 70, W, 70);   // letterbox
      if (Math.floor(state.t * 2) % 2) { ctx.fillStyle = '#ff3b3b'; ctx.fillRect(40, 26, 18, 18); }
      ptext('REPLAY', 120, 35, 3, '#ffffff'); ptext(`${R.i + 1} / ${R.clips.length}`, W - 110, 35, 3, '#c9c3e0');
      const near = Math.abs(R.f - c.focus) < 50;
      ptext(c.label, W / 2, H - 38, near ? 5 : 4, Render.TEAM_COLORS[c.team], { outline: true });
      ptext(`${Render.TEAM_NAMES[c.team].toUpperCase()} · ROUND ${c.round}`, W / 2, 35, 2, '#c9c3e0');
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, H - 6, W * R.f / (c.len - 1), 6);
      ptext('ENTER: NEXT   ESC: SKIP', W - 200, H - 38, 2, '#c9c3e0');
      buttons = [];
    },
  },
  results: { // the winners keep bouncing; the losers stand there
    update(dt) {
      state.resultsT += dt; state.t += dt; updateJuice(dt);
      physStep([state.winner === 0, state.winner === 1]);
      if (state.resultsT > 0.6) {
        if (menuKeys()) return;
        if (pressed('KeyQ') || pressed('Escape')) toMenu();
        else if (pressed('KeyH') && Replay.count() > 0) startReel('results');
      }
    },
    draw() {
      drawGame(); overlay(0.45);
      const team = state.winner;
      Render.crown(ctx, W / 2, 150, 2.4);
      ptext(`${Render.TEAM_NAMES[team]} WIN!`, W / 2, 240, 8, Render.TEAM_COLORS[team], { outline: true, shadow: 6 });
      ptext(`${state.score[0]} - ${state.score[1]}`, W / 2, 320, 8, '#ffffff', { outline: true });
      ptext(`AFTER ${state.round} ROUNDS`, W / 2, 370, 3, '#c9c3e0');
      buttons = [];
      btn('REMATCH', W / 2 - 300, 430, 270, 74, newMatch, 'ENTER OR SPACE', 4, { kind: 'primary', icon: 'restart' });
      btn('MAIN MENU', W / 2 + 30, 430, 270, 74, toMenu, 'Q OR ESC', 4, { kind: 'secondary', icon: 'home' });
      if (Replay.count() > 0 && tune.replay_clips > 0) btn('HIGHLIGHTS', W / 2 - 135, 565, 270, 56, () => startReel('results'), 'H', 3, { kind: 'secondary', icon: 'star' });
    },
  },
};

// ---- The replay reel: the best moments of the match, shown before the results
let reelState = null;
function startReel(then) {
  const clips = tune.replay_clips > 0 ? Replay.reel(tune.replay_clips, { label: tune.replay_label_repeat, kind: tune.replay_kind_repeat }) : [];
  if (!clips.length) { scene = then; return false; }
  reelState = { clips, i: 0, f: 0, then, cheered: false };
  Replay.borrow(world); scene = 'replay'; return true;
}
function endReel() { Replay.giveBack(); scene = reelState.then; reelState = null; }

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (pressed('KeyI')) { state.aiDebug = !state.aiDebug; hit.delete('KeyI'); }   // AI vision: what the CPU thinks will happen
  if (scene !== menuScene) {
    if (scene === 'title' && menuScene !== 'settings' && menuScene !== 'watch') introT = REDUCED_MOTION ? 1 : 0;   // coming back from a match replays the intro
    menuScene = scene; menuFocus = scene === 'settings' ? -1 : 0; }   // in settings the list has the keys; buttons light on hover
  if (menuPress) { menuPress.t -= STEP; if (menuPress.t <= 0) { const a = menuPress.action; menuPress = null; a(); } }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get ball() { return world ? { x: world.ball.position.x, y: world.ball.position.y } : null; }, // read-only, for checks
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
buildRound(1);
scene = params.get('scene') || 'title';
if (scene === 'play') { state.round = 1; }
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
